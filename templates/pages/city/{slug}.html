<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121c">
<title>City · Phish.net local cache</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/assets/manifest.json">
<meta name="apple-mobile-web-app-title" content="Phish">
<meta name="application-name" content="Phish stats">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .perf .venue a:hover { color: var(--blue); }
  .perf .slot .bo { color: var(--red); }
  .perf .slot .rec { color: var(--green); }
  .perf .gap .rec { color: var(--green); font-weight: 500; }
  .perf .gap .rec small { font-weight: 400; opacity: .7; }
  .badges { margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/song" title="Home: a fresh landing page">Phish stats<img src="/assets/icon.svg" alt="" width="24" height="24"></a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <nav class="quick" aria-label="Quick links"><a class="home" href="/song">Home</a><a href="/show/latest">Latest<span class="long"> show</span></a><a href="/show/random">Random<span class="long"> show</span></a><a href="/eras">Eras</a></nav>
  </header>
  <form class="search" role="search" autocomplete="off" id="searchForm">
    <div class="search-row">
      <input id="q" type="search" placeholder="Song, venue, city, or date" aria-label="Search" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button type="button" class="clear" id="clearBtn" aria-label="Clear" hidden>&times;</button>
      <div class="suggest" id="suggest" role="listbox" hidden></div>
    </div>
    <div class="search-hint"><span>Phish shows only, official stats</span><span></span></div>
  </form>

  <main id="out" aria-live="polite"></main>

  <p class="foot-note">{% include "_compliance.html" %}</p>
</div>

<script src="/assets/app.js"></script>
<script src="/assets/place.js"></script>
<script>
(function () {
  'use strict';
  var P = window.Phish;
  P.mountSearch({ input: document.getElementById('q'), suggest: document.getElementById('suggest'), clear: document.getElementById('clearBtn') });
  var slug = decodeURIComponent(location.pathname.split('/').pop());
  var out = document.getElementById('out');
  // The slug is resolved back to a city and state through the catalog, so
  // the SQL can compare plain columns instead of rebuilding slugs.
  P.loadCatalog().then(function (c) {
    var city = c.cities.filter(function (x) { return x.slug === slug; })[0];
    if (!city) { out.innerHTML = '<div class="state"><h1>No such city</h1><p>Try the search box above.</p></div>'; return; }
    P.renderPlace({ kind: 'city', city: city.city, state: city.state, label: city.name }, out);
  }).catch(function (e) { out.innerHTML = P.errorState(e); });
})();
</script>
</body>
</html>
