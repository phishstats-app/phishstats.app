version: 2
updates:
  # The workflow's actions are pinned to commit SHAs; Dependabot moves the pins
  # and keeps the version comment beside each one current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release must be a week old before it is proposed. A compromised
    # release of an action is usually noticed and withdrawn within days, so
    # the wait keeps it out of this repository. Security updates do not wait.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
